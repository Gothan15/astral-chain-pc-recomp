name: Addon

on:
  workflow_dispatch:
  push:
    branches: [reshade-antes-del-hud]
    paths:
      - "addon/**"
      - ".github/workflows/addon.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile the addon
        shell: cmd
        run: cl /std:c++17 /EHsc /LD /I addon\include addon\reshade_hud.cpp /Fe:reshade_hud.addon64
      - uses: actions/upload-artifact@v4
        with:
          name: reshade_hud
          path: reshade_hud.addon64
