# Fase 1: binds, iconos, camara, rueda, Esc, textos y post (2026-11-19) + arreglo wheel_feed
# Fase 2: BC7 y cache (2026-11-19 a 2026-11-21): retirado, el ASTC vuelve a ser el de Sparrow
name: Setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/setup.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Write the layout files from secrets
        shell: pwsh
        env:
          LAYOUT_JSON: ${{ secrets.AC_LAYOUT_JSON }}
          LAYOUT_H: ${{ secrets.AC_LAYOUT_H }}
        run: |
          if (-not $env:LAYOUT_JSON -or -not $env:LAYOUT_H) { throw "Faltan los secrets AC_LAYOUT_JSON y AC_LAYOUT_H" }
          New-Item -ItemType Directory -Force generated/v101 | Out-Null
          [IO.File]::WriteAllText("generated/v101/layout.json", $env:LAYOUT_JSON)
          [IO.File]::WriteAllText("generated/v101/layout.h", $env:LAYOUT_H)
          $lj = Get-Content generated/v101/layout.json -Raw | ConvertFrom-Json
          $main = $lj | Where-Object { $_.name -eq "main" }
          if ($main.base -ne "0x7000000000") { throw "layout.json inesperado: main no esta en 0x7000000000" }
          Write-Host "Modulos:" ($lj.name -join ", ")

      - name: Take shader-answers.bin from the official 1.21.0 release
        shell: pwsh
        run: |
          curl.exe -L -o oficial.zip "https://github.com/captainj-sparrow/astral-chain-pc-recomp/releases/download/1.21.0/Astral.Chain-Setup-1.21.0-windows.zip"
          Expand-Archive oficial.zip -DestinationPath oficial -Force
          Copy-Item "oficial/Astral Chain-Setup/data/shader-answers.bin" generated/shader-answers.bin
          Remove-Item oficial.zip
          Remove-Item oficial -Recurse -Force

      - name: MSYS2 packages for hactool and the runtime
        shell: pwsh
        run: |
          & "C:\msys64\usr\bin\pacman.exe" -Sy --needed --noconfirm mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-shaderc mingw-w64-ucrt-x86_64-spirv-tools mingw-w64-ucrt-x86_64-mesa make

      - name: Register the lavapipe software Vulkan driver
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Khronos\Vulkan\Drivers" /v "C:\msys64\ucrt64\share\vulkan\icd.d\lvp_icd.x86_64.json" /t REG_DWORD /d 0 /f

      - name: Build hactool
        shell: pwsh
        run: python tools/build_hactool.py

      - name: Build the shader translator
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\Microsoft Visual Studio\Installer;" + $env:PATH
          python tools/build_xlate.py

      - name: Fetch the MacNativeGames licence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "refs/MacNativeGames" | Out-Null
          curl.exe -fL "https://raw.githubusercontent.com/ly05010419/MacNativeGames/b75be8cfa704df3701e86130c8ced268e79d6b11/LICENSE" -o "refs/MacNativeGames/LICENSE"

      - name: Assemble the setup package
        shell: pwsh
        run: python tools/make_release.py --out "build/release/Astral Chain-Setup" --zip "build/release/Astral.Chain-Setup-main-windows.zip"

      - name: Stamp the release tag
        id: tagstamp
        shell: pwsh
        run: |
          $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById("Cuba Standard Time")
          $now = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz)
          $stamp = $now.ToString("yyyy-MM-dd-HHmm")
          "tag=main-$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagstamp.outputs.tag }}
          name: Astral Chain — ${{ steps.tagstamp.outputs.tag }}
          body: Paquete Setup compilado desde la rama main, sobre la base de Sparrow 1.21.0, con prompts de teclado y raton, rueda bindeable, sesgo de LOD, selector de camara de raton Sparrow o Puddz y preset de imagen ELZELDAPA antes del HUD. Se instala como siempre, con tu propia copia del juego; el ejecutable se compila en tu PC durante la instalacion.
          files: build/release/Astral.Chain-Setup-main-windows.zip
